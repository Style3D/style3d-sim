[project]
name = "style3d-sim"
version = "2.0.0"
description = "CUDA implicit solver for particles, cloth, and affine rigid bodies"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "newton>=1.7.0",
    "numpy>=2.0.0",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
# `uv sync --extra examples`.
examples = [
    "newton[examples]>=1.7.0",
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.9",
    "mujoco>=3.3",
    "scipy>=1.14",
    "torch>=2.7",
]
# Go2/G1 PPO training, checkpoint export, and ONNX Runtime verification.
locomotion = [
    "ipywidgets>=8.0.4",
    "newton[examples]>=1.7.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.4",
    "pyyaml>=6.0",
    "rsl-rl-lib==2.3.1",
    "tensorboard>=2.17",
    "torch>=2.7",
]

[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.22",
    "mkdocs-static-i18n==1.3.0",
]
# Tools used for local testing, binding development, and stub generation.
dev = [
    "pytest>=9.1.1",
    "pybind11>=2.13",
    "poethepoet>=0.38",
    "pybind11-stubgen>=2.5",
]

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.uv]
# Keep uv's cache inside the repository so managed Windows environments do not
# depend on permissions of the per-user cache directory.
cache-dir = ".uvcache"

[tool.scikit-build]
# Package the public Python sources alongside the compiled `_core` extension.
wheel.packages = ["src/style3d_sim"]
cmake.build-type = "Release"
# Keep public installs independent of any private source checkout.
cmake.define.SYNREAL_SOLVER_USE_PREBUILT = "ON"
# Include only the files needed to rebuild public wheels, even in an internal checkout.
sdist.exclude = ["*"]
sdist.include = [
    "/pyproject.toml",
    "/CMakeLists.txt",
    "/README.md",
    "/LICENSE",
    "/src/style3d_sim/*.py",
    "/src/style3d_sim/*.pyi",
    "/style3d-sim-bin/CMakeLists.txt",
    "/style3d-sim-bin/LICENSE",
    "/style3d-sim-bin/git_commit.txt",
    "/style3d-sim-bin/Windows/Release/*.pyd",
    "/style3d-sim-bin/Linux/Release/*.so",
]

[tool.poe.tasks]
# Generate `_core.pyi` from the docstrings and signatures of the built module.
# Run `uv run poe stubs` after building or installing the `_core` extension.
stubs = "pybind11-stubgen style3d_sim._core -o src"
